<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nym Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --background: hsl(25 8% 8%);
        --foreground: hsl(30 15% 92%);
        --muted: hsl(25 8% 68%);
        --border: hsl(25 8% 16%);
        --card: hsl(25 8% 12%);
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, hsl(25 8% 10%), hsl(25 8% 8%));
        color: var(--foreground);
        font-family: var(--font-sans);
      }
      .card {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
      }
      h1 { margin: 0 0 10px; font-size: 36px; letter-spacing: -0.04em; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Nym downloads</h1>
      <p>Coming soon.</p>
    </div>
  </body>
</html>
